name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official Real-ESRGAN NCNN/Vulkan engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/engine | Out-Null
          Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip" -OutFile "$env:RUNNER_TEMP\realesrgan.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\realesrgan.zip" -DestinationPath "resources/engine" -Force
          Remove-Item "$env:RUNNER_TEMP\realesrgan.zip" -Force

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer and portable
        run: npm run dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebUpscayl-Windows-v1.0.1
          path: release/*
          if-no-files-found: error
